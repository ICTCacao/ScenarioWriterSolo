# Windows 用（と Linux 用）のインストーラを GitHub Actions で作る。
# リポジトリに push するか、Actions の画面から手で実行すると、Artifacts に
#   ScenarioWriterWin_<版>_x64-setup.exe（NSIS）と ScenarioWriterWin_<版>_x64_en-US.msi
# ができる。Windows 機は要らない。
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux の依存（WebKitGTK）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: ScenarioWriterWin
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ScenarioWriterWin
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ScenarioWriterWin-${{ matrix.os }}
          path: |
            ScenarioWriterWin/src-tauri/target/release/bundle/nsis/*.exe
            ScenarioWriterWin/src-tauri/target/release/bundle/msi/*.msi
            ScenarioWriterWin/src-tauri/target/release/bundle/deb/*.deb
            ScenarioWriterWin/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
