name: ScenarioWriterSolo
options:
  bundleIdPrefix: com.ictcacao
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ScenarioWriterCore:
    path: Packages/ScenarioWriterCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # 脚本エディタ（Web 版 ScenarioWriterCafe のひとり用ローカル版。PHP もサーバも不要）
  ScenarioWriterSolo:
    type: application
    platform: macOS
    sources:
      - path: ScenarioWriterSolo
        excludes:
          - "Resources/*.plist"
      - path: LICENSE
        buildPhase: resources
      - path: README.md
        buildPhase: resources
    dependencies:
      - package: ScenarioWriterCore
    info:
      path: ScenarioWriterSolo/Resources/Info.plist
      properties:
        CFBundleDisplayName: ScenarioWriterSolo
        CFBundleName: ScenarioWriterSolo
        CFBundleShortVersionString: "β8"
        CFBundleVersion: "8"
        LSMinimumSystemVersion: "15.0"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 ICTCacao"
        CFBundleDocumentTypes:
          - CFBundleTypeName: ScenarioWriterSolo 作品
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.ictcacao.scwd]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ictcacao.scwd
            UTTypeDescription: ScenarioWriterSolo 作品
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [scwd]
    entitlements:
      path: ScenarioWriterSolo/Resources/ScenarioWriterSolo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # 「読む」画面の WKWebView（ローカル HTML のみ）が Web コンテンツプロセスを起動するために必要
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ictcacao.ScenarioWriterSolo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  ScenarioWriterSolo:
    build:
      targets:
        ScenarioWriterSolo: all
    run:
      config: Debug
